name: Apply reviewed static link contract fix
on:
  push:
    branches: [static-engine]
    paths: ['.github/workflows/static-apply-reviewed-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and apply the reviewed patch
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''''''
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '603c95fdcd64008fd3c169ea586ac3341ba0553a3ad043437863977a587697d1'
          pathlib.Path('reviewed.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','reviewed.patch'],check=True)
          subprocess.run(['git','apply','reviewed.patch'],check=True)
          subprocess.run(['python','-m','unittest','discover','-s','vcpkg/ports/cef-static/tests','-v'],check=True)
      - name: Commit only checked source changes without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vcpkg/ports/cef-static/export_static.py vcpkg/ports/cef-static/smoke.c vcpkg/ports/cef-static/tests/test_static_contract.py
          git diff --cached --stat
          git commit -m 'fix(static): preserve observed Linux link semantics and protect fork entry frame'
          git push origin HEAD:refs/heads/static-engine
          git rev-parse HEAD
