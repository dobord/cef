name: Static engine source review
on:
  push:
    branches: [static-engine]
    paths: ['.github/workflows/static-source-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked recipe and pinned dependency review inputs
        shell: python
        run: |
          import ast, base64, hashlib, json, pathlib, re, subprocess, urllib.request
          out = pathlib.Path('review-inputs'); out.mkdir()
          subprocess.run(['git', 'archive', '--format=zip', '-o', str(out/'cef-source.zip'), 'HEAD'], check=True)
          revision = '79460ebecaa5625e57a5fb679a735659e73dc687'
          receipt = []
          def download(repo, revision, path, directory):
              url = f'https://raw.githubusercontent.com/{repo}/{revision}/{path}'
              if repo == 'google/dawn':
                  url = f'https://dawn.googlesource.com/dawn/+/{revision}/{path}?format=TEXT'
              try:
                  with urllib.request.urlopen(url, timeout=60) as response: data = response.read()
                  if repo == 'google/dawn': data = base64.b64decode(data,validate=True)
              except Exception as error:
                  receipt.append({'url':url, 'error':str(error)}); return None
              target = out/directory/path; target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(data)
              receipt.append({'url':url, 'sha256':hashlib.sha256(data).hexdigest()})
              return data.decode('utf-8')
          deps = download('chromium/chromium', revision, 'DEPS', 'chromium')
          for path in ['BUILD.gn','.gn','build/config/BUILDCONFIG.gn','build/config/compiler/BUILD.gn',
                       'chrome/chrome_elf/BUILD.gn','chrome/chrome_elf/chrome_elf_main.cc',
                       'chrome/chrome_elf/chrome_elf_main.h','chrome/install_static/BUILD.gn',
                       'chrome/install_static/initialize_from_primary_module.cc',
                       'gpu/command_buffer/service/shared_image/ozone_image_backing_factory.cc']:
              download('chromium/chromium', revision, path, 'chromium')
          # Resolve only literal strings and Var() additions; never execute DEPS.
          tree = ast.parse(deps)
          assignments = {n.targets[0].id:n.value for n in tree.body if isinstance(n,ast.Assign) and isinstance(n.targets[0],ast.Name)}
          variables = {}
          for key,value in zip(assignments['vars'].keys,assignments['vars'].values):
              if isinstance(key,ast.Constant) and isinstance(value,ast.Constant): variables[key.value]=value.value
          def evaluate(node):
              if isinstance(node,ast.Constant): return node.value
              if isinstance(node,ast.BinOp) and isinstance(node.op,ast.Add): return evaluate(node.left)+evaluate(node.right)
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Name) and node.func.id=='Var': return variables[evaluate(node.args[0])]
              if isinstance(node,ast.Dict):
                  return evaluate(next(v for k,v in zip(node.keys,node.values) if isinstance(k,ast.Constant) and k.value=='url'))
              raise ValueError('Nonliteral dependency expression')
          dependency = next(v for k,v in zip(assignments['deps'].keys,assignments['deps'].values) if isinstance(k,ast.Constant) and k.value=='src/third_party/dawn')
          dawn_url = evaluate(dependency); dawn_revision = dawn_url.rsplit('@',1)[1]
          if not re.fullmatch('[0-9a-f]{40}',dawn_revision): raise ValueError(dawn_url)
          for path in ['DEPS','scripts/dawn_features.gni','third_party/gn/dxc/BUILD.gn',
                       'src/dawn/native/BUILD.gn','src/dawn/native/d3d/PlatformFunctions.cpp',
                       'src/dawn/native/d3d/PlatformFunctions.h','src/dawn/native/d3d12/BackendD3D12.cpp']:
              download('google/dawn',dawn_revision,path,'dawn')
          (out/'sources.json').write_text(json.dumps({'chromium':revision,'dawn':dawn_revision,'files':receipt},indent=2)+'\n')
      - name: Run recipe regression tests (not an engine build)
        run: python -m unittest discover -s vcpkg/ports/cef-static/tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: static-source-review
          path: review-inputs/
          retention-days: 7
          if-no-files-found: error
