name: Static CEF iterations and verified vcpkg SDK
on:
  push:
    branches: [static-engine, vcpkg]
    paths:
      - 'vcpkg/ports/cef-static/**'
      - 'vcpkg/static/**'
      - '.github/workflows/static-engine-build.yml'
  pull_request:
    branches: [static-engine, vcpkg]
    paths:
      - 'vcpkg/ports/cef-static/**'
      - 'vcpkg/static/**'
      - '.github/workflows/static-engine-build.yml'
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  actions: read
concurrency:
  group: static-engine-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python -m unittest discover -s vcpkg/ports/cef-static/tests -v
      - run: python -m compileall -q vcpkg/ports/cef-static vcpkg/static
  checkpoint-preflight:
    needs: contract
    uses: ./.github/workflows/windows-checkpoint-regression.yml
  source-build:
    # Do not execute pull-request code on persistent/self-hosted machines.
    if: github.event_name != 'pull_request'
    needs: [contract, checkpoint-preflight]
    concurrency:
      group: cef-static-workspace-${{ matrix.triplet }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_labels: ${{ vars.CEF_STATIC_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]' }}
            work_root: ${{ vars.CEF_STATIC_LINUX_WORK }}
            triplet: x64-linux
          - runner_labels: ${{ vars.CEF_STATIC_WINDOWS_RUNNER_LABELS || '["windows-2022"]' }}
            work_root: ${{ vars.CEF_STATIC_WINDOWS_WORK }}
            triplet: x64-windows-static
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: ${{ fromJSON(vars.CEF_STATIC_JOB_TIMEOUT_MINUTES || '350') }}
    env:
      CEF_STATIC_WORK: ${{ matrix.work_root }}
      CEF_WINDOWS_SLICE_SECONDS: ${{ vars.CEF_WINDOWS_SLICE_SECONDS || '10800' }}
      CEF_STATIC_BUILD_TIMEOUT_SECONDS: ${{ vars.CEF_STATIC_BUILD_TIMEOUT_SECONDS || '18000' }}
      CEF_STATIC_JOBS: ${{ vars.CEF_STATIC_JOBS || '4' }}
      CCACHE_DIR: ${{ github.workspace }}/.cef-ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Linux hosted-runner capacity and build-test utilities
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y ccache xvfb xauth
          df -h /
      - name: Restore Linux compiler cache (never a runtime certificate)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CCACHE_DIR }}
          key: cef-static-152-linux-${{ hashFiles('vcpkg/ports/cef-static/patch_source.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cef-static-152-linux-${{ hashFiles('vcpkg/ports/cef-static/patch_source.py') }}-
            cef-static-152-linux-
      - name: Test native launchers in actual vcpkg scope before source checkout
        run: python vcpkg/static/toolcheck.py --triplet ${{ matrix.triplet }}
      - name: Restore compatible Windows source and Ninja checkpoint
        id: checkpoint
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python vcpkg/static/checkpoint.py restore
      - name: Resolve and verify the complete pinned source trees
        run: python vcpkg/ports/cef-static/source_build.py prepare --work "${{ matrix.work_root || format('{0}/cef-static', runner.temp) }}" --logs static-diagnostics/bootstrap
      - name: Install official Chromium Linux build prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo "${{ matrix.work_root || format('{0}/cef-static', runner.temp) }}/download/chromium/src/build/install-build-deps.sh" --no-prompt --no-arm --no-chromeos-fonts
      - name: Check static graph and export options (no native compilation)
        run: python vcpkg/ports/cef-static/source_build.py check --work "${{ matrix.work_root || format('{0}/cef-static', runner.temp) }}" --logs static-diagnostics/configure
      - name: Preserve configuration evidence before the engine build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cef-static-${{ matrix.triplet }}-configuration
          path: static-diagnostics/configure/
          if-no-files-found: warn
          retention-days: 7
      # The native reference executable depends on all regression objects.
      # Building them separately traversed almost the entire engine graph and
      # timed out after one hour before this stage was reached (run 34505690797).
      - name: Bounded Windows compilation (checkpoint is not an SDK)
        id: iteration
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        run: python vcpkg/static/windows_slice.py
      - name: Persist Windows progress before validation or runner shutdown
        if: steps.iteration.outputs.checkpoint_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.checkpoint.outputs.artifact_name }}
          path: windows-checkpoint/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Build through vcpkg and verify native and relocated SDK consumers
        id: package
        if: runner.os != 'Windows' || runner.environment != 'github-hosted' || steps.iteration.outputs.ready == 'true'
        run: python vcpkg/static/ci.py --triplet ${{ matrix.triplet }}
      - name: Compiler cache statistics
        if: always() && runner.os == 'Linux'
        run: ccache --show-stats
      - name: Save Linux compiler cache even if a later compile or link fails
        if: always() && runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CCACHE_DIR }}
          key: cef-static-152-linux-${{ hashFiles('vcpkg/ports/cef-static/patch_source.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve diagnostic evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cef-static-${{ matrix.triplet }}-diagnostics
          path: static-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve SDK only after successful source and external-consumer tests
        if: success() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cef-static-${{ matrix.triplet }}
          path: static-artifacts/
          if-no-files-found: error
          retention-days: 7
  sdk-readiness:
    needs: source-build
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Distinguish a checkpoint iteration from two validated SDKs
        id: check
        shell: python
        run: |
          import json, os, subprocess
          result = subprocess.check_output(['gh', 'api',
              'repos/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['RUN_ID']+'/artifacts?per_page=100'], text=True)
          names = {a['name'] for a in json.loads(result)['artifacts'] if not a['expired']}
          ready = {'cef-static-x64-linux', 'cef-static-x64-windows-static'} <= names
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready='+str(ready).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Both tested SDKs are available.\n' if ready else
                  '**No complete Windows/Linux SDK pair yet.** A checkpoint is not a release.\n')
  publish:
    if: github.event_name == 'release' && needs.sdk-readiness.outputs.ready == 'true'
    needs: [source-build, sdk-readiness]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Retrieve only SDKs from this successful run
        run: |
          gh run download "$RUN_ID" --repo "$GH_REPO" --name cef-static-x64-linux --dir artifacts/linux
          gh run download "$RUN_ID" --repo "$GH_REPO" --name cef-static-x64-windows-static --dir artifacts/windows
      - name: Verify static runtime proofs, source commit and archive hashes
        shell: python
        run: |
          import hashlib, json, os, pathlib
          root = pathlib.Path('artifacts')
          archives = list(root.rglob('*-static-engine-capi.zip'))
          if len(archives) != 2: raise RuntimeError('Expected exactly two native SDKs')
          for archive in archives:
              receipt = json.loads(archive.with_suffix('.json').read_text())
              if receipt['integration_commit'] != os.environ['EXPECTED_COMMIT']:
                  raise RuntimeError('SDK provenance mismatch')
              if receipt['engine_linkage'] != 'static' or not receipt['sdk_relocation_verified'] or not receipt['application_relocation_verified']:
                  raise RuntimeError('SDK is not a verified static engine')
              proof = receipt['smoke']
              if not all(proof[k] is True for k in ('javascript','paint','browser_modules_clean','renderer_modules_clean')) or proof['browser_pid'] == proof['renderer_pid']:
                  raise RuntimeError('Missing separate-renderer runtime proof')
              with archive.open('rb') as stream:
                  actual = hashlib.file_digest(stream,'sha256').hexdigest()
              if actual != pathlib.Path(str(archive)+'.sha256').read_text().split()[0]:
                  raise RuntimeError('SDK archive digest mismatch')
      - name: Attach tested static SDKs without overwriting existing release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f \( -name '*.zip' -o -name '*.sha256' -o -name '*.json' \) -print0)
          test "${#files[@]}" -eq 6
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GH_REPO"
