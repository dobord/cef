name: Static CEF iterations and verified vcpkg SDK
on:
  push:
    branches: [static-engine, vcpkg]
    paths:
      - 'vcpkg/ports/cef-static/**'
      - 'vcpkg/static/**'
      - '.github/workflows/static-engine-build.yml'
      - '.github/workflows/linux-checkpoint-regression.yml'
      - '.github/workflows/windows-audit-regression.yml'
  pull_request:
    branches: [static-engine, vcpkg]
    paths:
      - 'vcpkg/ports/cef-static/**'
      - 'vcpkg/static/**'
      - '.github/workflows/static-engine-build.yml'
      - '.github/workflows/linux-checkpoint-regression.yml'
      - '.github/workflows/windows-audit-regression.yml'
  workflow_dispatch:
    inputs:
      checkpoint_run:
        description: 'Completed producer run ID; empty selects the latest branch producer (no fallback)'
        type: string
        required: false
        default: ''
      checkpoint_mode:
        description: 'resume requires a checkpoint; fresh intentionally starts from source'
        type: choice
        options: [resume, fresh]
        required: true
        default: resume
  release:
    types: [published]
permissions:
  contents: read
  actions: read
concurrency:
  group: static-engine-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch pinned GPU source for exact-context regression
        shell: python
        run: |
          import hashlib, os, pathlib, time, urllib.request
          url = 'https://raw.githubusercontent.com/chromium/chromium/79460ebecaa5625e57a5fb679a735659e73dc687/gpu/ipc/service/gpu_init.cc'
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      data = response.read()
                  break
              except OSError:
                  if attempt == 2: raise
                  time.sleep(3)
          actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if actual != '09780f226ffe3794550e40cc6c692167b5c0ca00':
              raise RuntimeError('Pinned GPU source blob mismatch')
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'cef-gpu-init.cc').write_bytes(data)
      - run: python -m unittest discover -s vcpkg/ports/cef-static/tests -v
        env:
          CEF_PINNED_GPU_INIT: ${{ runner.temp }}/cef-gpu-init.cc
      - name: Test Linux iteration and archive contracts
        if: runner.os == 'Linux'
        run: python -m unittest discover -s vcpkg/static/tests -v
      - name: Test cross-run selection and no-progress guards on both platforms
        run: python -m unittest discover -s vcpkg/static/tests -p test_resume_checkpoint.py -v
      - name: Activate native Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^(Path|INCLUDE|LIB|LIBPATH|VSINSTALLDIR|VCINSTALLDIR|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|VSCMD_[^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
      - name: Fetch exact pinned Skia source for Dawn X11 regression
        shell: python
        run: |
          import hashlib, os, pathlib, time, urllib.request
          url = 'https://raw.githubusercontent.com/chromium/chromium/79460ebecaa5625e57a5fb679a735659e73dc687/components/viz/service/display_embedder/skia_output_surface_impl_on_gpu.cc'
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      data = response.read()
                  break
              except OSError:
                  if attempt == 2: raise
                  time.sleep(3)
          if hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() != 'd8485e68ef15f944a4d45facf2b6447a53412944':
              raise RuntimeError('Pinned Skia source mismatch')
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'cef-skia.cc').write_bytes(data)
      - name: Test Skia guard and reviewed checkpoint migration
        run: python -m unittest discover -s vcpkg/static/tests -p test_skia_resume.py -v
        env:
          CEF_PINNED_SKIA: ${{ runner.temp }}/cef-skia.cc
      - name: Prepare exact upstream runtime regression sources
        run: python vcpkg/static/prepare_runtime_fixture.py --destination "${{ runner.temp }}/cef-runtime-pinned"
      - name: Test allocator-safe seeding and Linux self-exec assets
        run: python -m unittest discover -s vcpkg/static/tests -p test_runtime_startup.py -v
        env:
          CEF_PINNED_RUNTIME: ${{ runner.temp }}/cef-runtime-pinned
      - name: Preserve Skia regression proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: skia-x11-regression-${{ matrix.os }}-${{ github.run_attempt }}
          path: static-diagnostics/skia-x11-regression.json
          if-no-files-found: warn
          retention-days: 7
      - run: python -m compileall -q vcpkg/ports/cef-static vcpkg/static
  checkpoint-preflight:
    needs: contract
    uses: ./.github/workflows/windows-checkpoint-regression.yml
  linux-checkpoint-preflight:
    needs: contract
    uses: ./.github/workflows/linux-checkpoint-regression.yml
  windows-audit-preflight:
    needs: contract
    uses: ./.github/workflows/windows-audit-regression.yml
  source-build:
    # Do not execute pull-request code on persistent/self-hosted machines.
    if: github.event_name != 'pull_request'
    needs: [contract, checkpoint-preflight, linux-checkpoint-preflight, windows-audit-preflight]
    concurrency:
      group: cef-static-workspace-${{ matrix.triplet }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_labels: ${{ vars.CEF_STATIC_LINUX_RUNNER_LABELS || '["ubuntu-24.04"]' }}
            work_root: ${{ vars.CEF_STATIC_LINUX_WORK }}
            triplet: x64-linux
          - runner_labels: ${{ vars.CEF_STATIC_WINDOWS_RUNNER_LABELS || '["windows-2022"]' }}
            work_root: ${{ vars.CEF_STATIC_WINDOWS_WORK }}
            triplet: x64-windows-static
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: ${{ fromJSON(vars.CEF_STATIC_JOB_TIMEOUT_MINUTES || '350') }}
    env:
      CEF_STATIC_WORK: ${{ matrix.work_root }}
      CEF_CHECKPOINT_RUN: ${{ inputs.checkpoint_run || '' }}
      CEF_CHECKPOINT_MODE: ${{ inputs.checkpoint_mode || (github.event_name == 'release' && 'fresh') || 'resume' }}
      CEF_LINUX_SLICE_SECONDS: ${{ vars.CEF_LINUX_SLICE_SECONDS || '10800' }}
      CEF_WINDOWS_SLICE_SECONDS: ${{ vars.CEF_WINDOWS_SLICE_SECONDS || '10800' }}
      CEF_STATIC_BUILD_TIMEOUT_SECONDS: ${{ vars.CEF_STATIC_BUILD_TIMEOUT_SECONDS || '18000' }}
      CEF_STATIC_JOBS: ${{ vars.CEF_STATIC_JOBS || '4' }}
      CCACHE_DIR: ${{ github.workspace }}/.cef-ccache
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reject same-run retry before expensive setup
        if: runner.environment == 'github-hosted'
        run: python vcpkg/static/resume_checkpoint.py guard
      - name: Linux hosted-runner capacity and build-test utilities
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y ccache xvfb xauth
          df -h /
      - name: Restore Linux compiler cache (never a runtime certificate)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CCACHE_DIR }}
          key: cef-static-152-linux-${{ hashFiles('vcpkg/ports/cef-static/patch_source.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cef-static-152-linux-${{ hashFiles('vcpkg/ports/cef-static/patch_source.py') }}-
            cef-static-152-linux-
      - name: Test native launchers in actual vcpkg scope before source checkout
        run: python vcpkg/static/toolcheck.py --triplet ${{ matrix.triplet }}
      - name: Restore compatible Windows source and Ninja checkpoint
        id: checkpoint
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python vcpkg/static/resume_checkpoint.py restore
      - name: Restore compatible Ubuntu source and Ninja checkpoint
        id: linux_checkpoint
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python vcpkg/static/resume_checkpoint.py restore
      - name: Resolve and verify the complete pinned source trees
        run: python vcpkg/ports/cef-static/source_build.py prepare --work "${{ matrix.work_root || format('{0}/cef-static', runner.temp) }}" --logs static-diagnostics/bootstrap
      - name: Install official Chromium Linux build prerequisites
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: sudo "${{ matrix.work_root || format('{0}/cef-static', runner.temp) }}/download/chromium/src/build/install-build-deps.sh" --no-prompt --no-arm --no-chromeos-fonts
      - name: Check static graph and export options (no native compilation)
        run: python vcpkg/ports/cef-static/source_build.py check --work "${{ matrix.work_root || format('{0}/cef-static', runner.temp) }}" --logs static-diagnostics/configure
      - name: Verify self-contained Windows archive export with pinned tools
        if: runner.os == 'Windows'
        env:
          CEF_ARCHIVE_EXPORT_NATIVE: '1'
        run: python -I -m unittest discover -s vcpkg/static/tests -p test_windows_archive_export.py -v
      - name: Preserve configuration evidence before the engine build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cef-static-${{ matrix.triplet }}-configuration-${{ github.run_attempt }}
          path: static-diagnostics/configure/
          if-no-files-found: warn
          retention-days: 7
      # The native reference executable depends on all regression objects.
      # Building them separately traversed almost the entire engine graph and
      # timed out after one hour before this stage was reached (run 34505690797).
      - name: Record restored Ninja outputs before the compilation slice
        if: runner.environment == 'github-hosted'
        run: python vcpkg/static/resume_checkpoint.py audit-before
      - name: Bounded Windows compilation (checkpoint is not an SDK)
        id: iteration
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        run: python vcpkg/static/windows_slice.py
      - name: Persist Windows progress before validation or runner shutdown
        if: steps.iteration.outputs.checkpoint_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.checkpoint.outputs.artifact_name }}
          path: windows-checkpoint/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Bounded Ubuntu compilation (checkpoint is not an SDK)
        id: linux_iteration
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: python vcpkg/static/linux_slice.py
      - name: Persist Ubuntu progress before validation or runner shutdown
        if: ${{ !cancelled() && steps.linux_iteration.outputs.checkpoint_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.linux_checkpoint.outputs.artifact_name }}
          path: linux-checkpoint/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Require measurable progress after checkpoint upload
        if: ${{ !cancelled() && (steps.iteration.outputs.checkpoint_ready == 'true' || steps.linux_iteration.outputs.checkpoint_ready == 'true') }}
        env:
          CEF_ITERATION_READY: ${{ steps.iteration.outputs.ready || steps.linux_iteration.outputs.ready || 'false' }}
        run: python vcpkg/static/resume_checkpoint.py audit-after
      - name: Build through vcpkg and verify native and relocated SDK consumers
        id: package
        if: runner.environment != 'github-hosted' || (runner.os == 'Windows' && steps.iteration.outputs.ready == 'true') || (runner.os == 'Linux' && steps.linux_iteration.outputs.ready == 'true')
        run: python vcpkg/static/ci.py --triplet ${{ matrix.triplet }}
      - name: Compiler cache statistics
        if: always() && runner.os == 'Linux'
        run: ccache --show-stats
      - name: Save Linux compiler cache even if a later compile or link fails
        if: always() && runner.os == 'Linux' && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CCACHE_DIR }}
          key: cef-static-152-linux-${{ hashFiles('vcpkg/ports/cef-static/patch_source.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve diagnostic evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cef-static-${{ matrix.triplet }}-diagnostics-${{ github.run_attempt }}
          path: static-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve SDK only after successful source and external-consumer tests
        if: success() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cef-static-${{ matrix.triplet }}-sdk-${{ github.run_attempt }}
          path: static-artifacts/
          if-no-files-found: error
          retention-days: 7
  sdk-readiness:
    needs: source-build
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      linux: ${{ steps.check.outputs.linux }}
      windows: ${{ steps.check.outputs.windows }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Distinguish a checkpoint iteration from two validated SDKs
        id: check
        shell: python
        run: |
          import json, os, subprocess
          result = subprocess.check_output(['gh', 'api',
              'repos/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['RUN_ID']+'/artifacts?per_page=100'], text=True)
          names = {a['name'] for a in json.loads(result)['artifacts'] if not a['expired']}
          selected = {}
          for platform, triplet in [('linux', 'x64-linux'), ('windows', 'x64-windows-static')]:
              prefix = 'cef-static-'+triplet+'-sdk-'
              candidates = [n for n in names if n.startswith(prefix) and n[len(prefix):].isdigit()]
              if candidates: selected[platform] = max(candidates, key=lambda n: int(n[len(prefix):]))
          ready = len(selected) == 2
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready='+str(ready).lower()+'\n')
              for platform, name in selected.items(): output.write(platform+'='+name+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Both tested SDKs are available.\n' if ready else
                  '**No complete Windows/Linux SDK pair yet.** A checkpoint is not a release.\n')
  publish:
    if: github.event_name == 'release' && needs.sdk-readiness.outputs.ready == 'true'
    needs: [source-build, sdk-readiness]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      EXPECTED_COMMIT: ${{ github.sha }}
      LINUX_SDK: ${{ needs.sdk-readiness.outputs.linux }}
      WINDOWS_SDK: ${{ needs.sdk-readiness.outputs.windows }}
    steps:
      - name: Retrieve only SDKs from this successful run
        run: |
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "$LINUX_SDK" --dir artifacts/linux
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "$WINDOWS_SDK" --dir artifacts/windows
      - name: Verify static runtime proofs, source commit and archive hashes
        shell: python
        run: |
          import hashlib, json, os, pathlib
          root = pathlib.Path('artifacts')
          archives = list(root.rglob('*-static-engine-capi.zip'))
          if len(archives) != 2: raise RuntimeError('Expected exactly two native SDKs')
          for archive in archives:
              receipt = json.loads(archive.with_suffix('.json').read_text())
              if receipt['integration_commit'] != os.environ['EXPECTED_COMMIT']:
                  raise RuntimeError('SDK provenance mismatch')
              if receipt['engine_linkage'] != 'static' or not receipt['sdk_relocation_verified'] or not receipt['application_relocation_verified']:
                  raise RuntimeError('SDK is not a verified static engine')
              proof = receipt['smoke']
              if not all(proof[k] is True for k in ('javascript','paint','browser_modules_clean','renderer_modules_clean')) or proof['browser_pid'] == proof['renderer_pid']:
                  raise RuntimeError('Missing separate-renderer runtime proof')
              with archive.open('rb') as stream:
                  actual = hashlib.file_digest(stream,'sha256').hexdigest()
              if actual != pathlib.Path(str(archive)+'.sha256').read_text().split()[0]:
                  raise RuntimeError('SDK archive digest mismatch')
      - name: Attach tested static SDKs without overwriting existing release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find artifacts -type f \( -name '*.zip' -o -name '*.sha256' -o -name '*.json' \) -print0)
          test "${#files[@]}" -eq 6
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GH_REPO"
