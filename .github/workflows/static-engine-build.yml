name: Static CEF engine from Chromium sources
on:
  push:
    branches: [static-engine]
    paths:
      - 'vcpkg/ports/cef-static/**'
      - '.github/workflows/static-engine-build.yml'
permissions:
  contents: read
concurrency:
  group: static-engine-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reclaim unrelated preinstalled SDKs on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          sudo apt-get update
          sudo apt-get install -y ccache xvfb xauth
          df -h /
      - name: Checkout the pinned complete Chromium and CEF source trees
        run: python vcpkg/ports/cef-static/source_build.py prepare --work "${{ runner.temp }}/cef-static" --logs diagnostics
      - name: Install upstream Chromium Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo "${{ runner.temp }}/cef-static/download/chromium/src/build/install-build-deps.sh" --no-prompt --no-arm --no-chromeos-fonts
      - name: Compile, link, relocate and execute the static engine C API reference
        run: python vcpkg/ports/cef-static/source_build.py build --work "${{ runner.temp }}/cef-static" --logs diagnostics --jobs 4
      - name: Keep actual diagnostics, including failed source/configuration/build phases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-engine-${{ matrix.os }}-diagnostics
          path: diagnostics/
          retention-days: 7
          if-no-files-found: error
