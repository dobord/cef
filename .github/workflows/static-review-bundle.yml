name: Static source review snapshot
on:
  push:
    branches: [static-engine]
    paths: ['.github/workflows/static-review-bundle.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=static-source-snapshot.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-source-snapshot
          path: static-source-snapshot.zip
          retention-days: 7
