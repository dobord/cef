name: Static vcpkg adapter contracts
on:
  push:
    branches: [feature/vcpkg-static-integration]
  pull_request:
    branches: [static-engine]
    paths: ['vcpkg/integration/**', '.github/workflows/vcpkg-adapter.yml']
permissions:
  contents: read
jobs:
  adapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s vcpkg/integration/tests -v
      - run: python -m unittest discover -s vcpkg/static/tests -p test_sdk_package.py -v
      - run: python -m compileall -q vcpkg/integration
