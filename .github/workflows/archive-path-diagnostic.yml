name: Identify static archive source path
on:
  push:
    branches:
      - feature/vcpkg-static-integration
    paths:
      - .github/workflows/archive-path-diagnostic.yml
permissions:
  contents: read
jobs:
  identify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Resolve exported archive hash to native link input
        shell: python
        run: |
          import gzip, hashlib, pathlib, re
          target = "7aff207fa4d8"
          path = pathlib.Path("vcpkg/ports/cef-static/tests/fixtures/native-link-windows.txt.gz")
          text = gzip.decompress(path.read_bytes()).decode("utf-8", errors="strict")
          candidates = []
          for raw in text.splitlines():
              value = raw.strip().removeprefix("| ").strip()
              if not value or value.startswith("||"):
                  continue
              # Exporter hashes source-relative paths after resolving out/ inputs.
              # The historical fixture stores Ninja link-edge input spelling.
              variants = {value}
              if value.startswith("//"):
                  variants.add(value[2:])
              for item in variants:
                  if hashlib.sha256(item.replace("\\","/").encode()).hexdigest().startswith(target):
                      candidates.append((value,item))
          print("ARCHIVE_HASH_MATCHES=" + repr(candidates))
          if not candidates:
              # Also emit basename/index-near candidates for diagnosis without
              # dumping the full native link edge.
              libs=[x.strip().removeprefix("| ").strip() for x in text.splitlines()
                    if x.strip().lower().endswith(".lib")]
              print("WINDOWS_LIB_INPUT_COUNT="+str(len(libs)))
          if len(candidates) != 1:
              raise SystemExit("expected one exact source-path hash match")
