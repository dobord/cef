name: Static source diagnosis snapshot
on:
  push:
    branches: [static-engine]
    paths: ['.github/workflows/static-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          mkdir -p snapshot
          git archive --format=tar HEAD | gzip > snapshot/cef-source.tar.gz
          git rev-parse HEAD > snapshot/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-source-snapshot
          path: snapshot/
          retention-days: 3
