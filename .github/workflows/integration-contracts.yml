name: CEF acquisition and iteration contracts
on:
  push:
    branches: [feature/vcpkg-static-integration]
    paths: ['vcpkg/integration/**', '.github/workflows/integration-contracts.yml']
  pull_request:
    branches: [static-engine]
    paths: ['vcpkg/integration/**', '.github/workflows/integration-contracts.yml']
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s vcpkg/integration/tests -v
      - run: python -m compileall -q vcpkg/integration
